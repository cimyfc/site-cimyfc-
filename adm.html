<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geral de ADM - Cimy FC</title>
    <!-- Biblioteca do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1b5e20;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #2e7d32;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            color: #81c784;
            font-size: 1.3rem;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: white;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 70px;
        }
        button {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .lista-itens {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        .item-linha {
            background-color: #2d2d2d;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border-left: 4px solid #2e7d32;
        }
        .item-conteudo {
            flex-grow: 1;
            padding-right: 10px;
        }
        .btn-deletar {
            background-color: #c62828;
            color: white;
            border: none;
            width: auto;
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .resumo-financas {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            background-color: #2d2d2d;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .verde { color: #81c784; }
        .vermelho { color: #e57373; }
        .data-tag {
            display: inline-block;
            background-color: #444;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 4px;
        }
        .grid-jogadores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn-jogador-rapido {
            background-color: #333;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            border: 1px solid #444;
        }
        .atleta-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔐 Painel de ADM Compartilhado</h1>
        <p>Nuvem Ativa • Cimy FC</p>
    </header>

    <div class="container">
        <!-- 1. GESTÃO DE ATLETAS -->
        <div class="card">
            <h2>🏃‍♂️ Gerenciar Elenco do Time</h2>
            <label for="novoAtletaNome">Nome do Novo Jogador:</label>
            <input type="text" id="novoAtletaNome" placeholder="Ex: Novo Contratado">
            <button onclick="adicionarNovoAtleta()" style="background-color: #1976d2; margin-bottom: 15px;">➕ Adicionar ao Elenco</button>
            
            <label>Elenco Atual:</label>
            <div id="elencoCompletoStatus" style="margin-top: 5px;"></div>
        </div>

        <!-- 2. REGISTRO DISCIPLINAR -->
        <div class="card">
            <h2>⚠️ Ficha Disciplinar (Ocorrências)</h2>
            <p style="font-size: 0.85rem; color: #aaa; margin-top: 0;">Clique no nome do atleta abaixo:</p>
            <div class="grid-jogadores" id="botoesJogadoresRapidos"></div>

            <label for="nomeJogadorOcorrencia">Jogador Selecionado:</label>
            <input type="text" id="nomeJogadorOcorrencia" placeholder="Selecione um nome acima" readonly style="background-color: #1a1a1a; color: #81c784; font-weight: bold;">
            
            <label for="observacaoJogador">O que ele aprontou / Observação:</label>
            <textarea id="observacaoJogador" placeholder="Ex: Faltou ao treino..."></textarea>
            
            <button onclick="salvarOcorrencia()">Gravar Advertência na Nuvem</button>
            <div class="lista-itens" id="listaOcorrencias"></div>
        </div>

        <!-- 3. CONTROLE FINANCEIRO -->
        <div class="card">
            <h2>💰 Lucros e Finanças</h2>
            <label for="descFinanca">Descrição da Movimentação:</label>
            <input type="text" id="descFinanca" placeholder="Ex: Venda de camisa">
            
            <label for="tipoFinanca">Tipo:</label>
            <select id="tipoFinanca">
                <option value="entrada">Entrada / Lucro (+)</option>
                <option value="saida">Saída / Gasto (-)</option>
            </select>

            <label for="valorFinanca">Valor (R$):</label>
            <input type="number" id="valorFinanca" placeholder="0.00" step="0.01">
            
            <button onclick="salvarFinanca()">Registrar Caixa</button>
            <div class="resumo-financas">
                <div>Saldo Total Geral: <span id="saldoTotal" class="verde">R$ 0,00</span></div>
            </div>
            <div class="lista-itens" id="listaFinancas"></div>
        </div>

        <!-- 4. AGENDA DE VÍDEOS -->
        <div class="card">
            <h2>🎥 Agenda de Próximos Vídeos</h2>
            <label for="tituloVideo">Título do Vídeo:</label>
            <input type="text" id="tituloVideo" placeholder="Ex: Melhores Momentos">
            
            <label for="dataVideo">Data de Lançamento:</label>
            <input type="date" id="dataVideo">
            
            <button onclick="salvarVideo()">Agendar Postagem</button>
            <div class="lista-itens" id="listaVideos"></div>
        </div>

        <!-- 5. DIÁRIO DE IDEIAS -->
        <div class="card">
            <h2>💡 Bloco de Ideias Compartilhado</h2>
            <label for="textoIdeia">Escreva sua nova ideia aqui:</label>
            <textarea id="textoIdeia" placeholder="Ex: Ideia de conteúdo..."></textarea>
            
            <button onclick="salvarIdeia()">Salvar Anotação</button>
            <div class="lista-itens" id="listaIdeias"></div>
        </div>
    </div>

    <script>
        // Correção de inicialização global do Supabase via CDN
        var URL_BANCO = "https://oamvfvyuaqolsswklljp.supabase.co";
        var CHAVE_BANCO = "sb_publishable_5ebh8AehOkTaa3XEpcTw2Q_prA9FIFl";
        
        // Destrutura o createClient de dentro da variável global injetada pela tag script
        var createClient = supabase.createClient;
        var conexaoApi = createClient(URL_BANCO, CHAVE_BANCO);

        var elencoInicial = ["Ícaro", "Moisés", "Gustavo", "Yuri", "Caio", "Yago", "Paulo Gabriel"];
        if(!localStorage.getItem("cimy_elenco")) {
            localStorage.setItem("cimy_elenco", JSON.stringify(elencoInicial));
        }

        document.addEventListener("DOMContentLoaded", function() {
            renderizarElenco();
            puxarDadosNuvem();
            setInterval(puxarDadosNuvem, 5000);
        });

        function renderizarElenco() {
            var elenco = JSON.parse(localStorage.getItem("cimy_elenco")) || [];
            var containerBotoes = document.getElementById("botoesJogadoresRapidos");
            var containerLista = document.getElementById("elencoCompletoStatus");
            
            containerBotoes.innerHTML = "";
            containerLista.innerHTML = "";

            for(var i = 0; i < elenco.length; i++) {
                var nome = elenco[i];
                containerBotoes.innerHTML += '<div class="btn-jogador-rapido" onclick="selecionarJogador(\'' + nome + '\')">🏃‍♂️ ' + nome + '</div>';
                containerLista.innerHTML += '<div class="atleta-box"><span>• ' + nome + '</span><button class="btn-deletar" style="padding: 2px 6px; font-size: 0.75rem;" onclick="removerAtleta(' + i + ')">X</button></div>';
            }
        }

        function adicionarNovoAtleta() {
            var nomeInput = document.getElementById("novoAtletaNome");
            var nome = nomeInput.value.trim();
            if(!nome) return alert("Digite o nome do jogador!");
            
            var elenco = JSON.parse(localStorage.getItem("cimy_elenco")) || [];
            elenco.push(nome);
